<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio Cricket</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d3b1e">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--turf:#15532a;--chalk:#f6f3e8;--amber:#ffc21a}
*{box-sizing:border-box}
body{margin:0;padding:12px;min-height:100vh;font-family:system-ui,"Noto Sans Devanagari",sans-serif;background:repeating-linear-gradient(90deg,#0d3b1e 0 48px,#0f4121 48px 96px);color:var(--chalk);line-height:1.5}
main{max-width:640px;margin:0 auto}
h1{font-size:1.5rem;margin:4px 0 10px}
#score{font-size:1.4rem;font-weight:700;background:var(--turf);border:3px solid var(--chalk);border-radius:12px;padding:12px;margin:0 0 8px}
#status{font-size:1.2rem;min-height:4.5em;padding:8px 4px}
button{font:inherit;font-weight:700;font-size:1.15rem;width:100%;margin:6px 0;padding:16px;border:3px solid var(--chalk);border-radius:14px;background:var(--turf);color:var(--chalk)}
#hit{background:var(--amber);color:#111;border-color:#111}
.shot{min-height:34vh;background:var(--amber);color:#111;border-color:#111;font-size:1.35rem}
button:disabled{opacity:.7}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid #fff;outline-offset:3px}
.row{display:flex;gap:8px}.row button{flex:1}
label{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
input[type=checkbox]{width:26px;height:26px;flex:none}
details{background:var(--turf);border:2px solid var(--chalk);border-radius:12px;padding:10px 14px;margin-top:10px}
summary{font-weight:700}
dialog{background:#15532a;color:#f6f3e8;border:3px solid #f6f3e8;border-radius:14px;width:min(92vw,520px)}
dialog::backdrop{background:rgba(0,0,0,.7)}
h2{font-size:1.3rem;margin:6px 0}
</style>
</head>
<body>
<main>
<p id="status" role="status" aria-live="polite"></p>
<section id="pg-welc" hidden><h2 id="welcT"></h2><p id="welcP"></p><button id="wgs"></button><button id="skp"></button></section>
<section id="pg-home"><h1 id="title"></h1><button id="hmP"></button><button id="hmS"></button><button id="hmN"></button><button id="hmO"></button><button id="hmR"></button><p id="ver"></p></section>
<section id="pg-prof" hidden><h2 id="profT"></h2><p id="pst"></p><button id="gsb"></button><button class="bk"></button></section>
<section id="pg-set" hidden><h2 id="setT"></h2><button id="langb"></button><button id="test"></button><button id="btb"></button>
<label><input type="checkbox" id="vibc" checked><span id="vibl"></span></label>
<label><input type="checkbox" id="tts"><span id="ttsl"></span></label><button class="bk"></button></section>
<section id="pg-off" hidden><h2 id="offT"></h2><button id="hit"></button><button id="prac"></button><button id="ovb"></button><button id="lvb"></button><button class="bk"></button></section>
<section id="pg-on" hidden><h2 id="onpT"></h2><p id="onMsg"></p><button id="mkr"></button><h2 id="rlT"></h2><div id="rlist"></div><button class="bk"></button></section>
<section id="pg-rul" hidden><h2 id="rulesT"></h2><div id="rulesB"></div><button class="bk"></button></section>
<section id="pg-lobby" hidden><h2 id="lobT"></h2><p id="lobInfo"></p><div id="plist"></div><button id="stg" hidden></button><button id="lcn"></button></section>
<section id="pg-toss" hidden><h2 id="tossT"></h2><button id="tbat"></button><button id="tbow"></button></section>
<section id="pg-match" hidden><p id="score"></p><p id="roleLine"></p>
<canvas id="cv" width="360" height="200" aria-hidden="true" role="presentation" style="width:100%;border-radius:12px;background:#0f4a25;margin:6px 0"></canvas>
<div class="row"><button class="shot" id="sL" data-s="-1"></button><button class="shot" id="sC" data-s="0"></button><button class="shot" id="sR" data-s="1"></button></div>
<button id="rep"></button><button id="msgb" hidden></button><p id="chat" role="status" aria-live="polite"></p><button id="rpt" hidden></button></section>
<dialog id="mdlg" aria-labelledby="mT"><h2 id="mT"></h2><div id="presets"></div>
<label for="mtx" id="mtxL"></label><input id="mtx" type="text" maxlength="80" style="font:inherit;font-size:1.2rem;padding:12px;width:100%;border-radius:10px;border:3px solid #f6f3e8"><button id="msnd"></button><button id="mcl"></button></dialog>
<dialog id="pdlg" aria-labelledby="pdT"><h2 id="pdT"></h2><button id="pdSel"></button><button id="pdWait"></button><button id="pdRem"></button><button id="pdCl"></button></dialog>
<dialog id="dlg" aria-labelledby="dlgT"><h2 id="dlgT"></h2>
<label for="ovn" id="ovL"></label><input id="ovn" type="number" min="1" max="20" value="2" style="font:inherit;font-size:1.2rem;padding:12px;width:100%;border-radius:10px;border:3px solid #f6f3e8">
<label for="wkn" id="wkL"></label><input id="wkn" type="number" min="1" max="10" value="3" style="font:inherit;font-size:1.2rem;padding:12px;width:100%;border-radius:10px;border:3px solid #f6f3e8">
<button id="dcr"></button><button id="dcn"></button></dialog>
</main>

  say((w?l.win(G.runs):l.lose(G.target-G.runs,G.runs))+' '+l.stats(G.f4,G.s6)+' '+l.best(CFG.best),()=>{});
}
$('hit').addEventListener('click',()=>{initAudio();if(state==='idle')startMatch();});
['sL','sC','sR'].forEach(id=>{const b=$(id),sd=+b.dataset.s;
  b.addEventListener('pointerdown',()=>{lastDown=performance.now();tap(sd);});
  b.addEventListener('click',()=>{if(performance.now()-lastDown>500)tap(sd);});});
$('prac').addEventListener('click',()=>{
  if(onl||state==='bowl'||state==='wait')return;initAudio();
  ball=pick(true);state='wait';say(L().pracBall(L().names[ball.i]),()=>setTimeout(deliver,500));
});
$('ovb').addEventListener('click',()=>{if(state!=='idle')return;CFG.ov=CFG.ov===2?5:2;saveC();ui();show(L().ovl(CFG.ov));});
$('lvb').addEventListener('click',()=>{if(state!=='idle')return;CFG.lv=(CFG.lv+1)%3;saveC();ui();show(L().lv+': '+L().lvn[CFG.lv]);});
$('btb').addEventListener('click',()=>{if(state!=='idle')return;CFG.bt=(CFG.bt+1)%4;saveC();ui();show(L().bt+': '+L().btl[CFG.bt]);});
$('rpt').addEventListener('click',()=>{if(tts)say(lastT);else{$('status').textContent='';setTimeout(()=>{$('status').textContent=lastT;},80);}});
$('mkr').addEventListener('click',mkRoom);
const go=p=>{page=p;watchRooms(p==='on');ui();};
[['hmP','prof'],['hmS','set'],['hmN','off'],['hmO','on'],['hmR','rul']].forEach(([id,p])=>$(id).addEventListener('click',()=>go(p)));
document.querySelectorAll('.bk').forEach(b=>b.addEventListener('click',()=>go('home')));
$('msgb').addEventListener('click',()=>{const l=L(),b=$('presets');b.textContent='';
  $('mT').textContent=l.mT;$('mtxL').textContent=l.mtxL;$('msnd').textContent=l.msnd;$('mcl').textContent=l.dcn;$('mtx').value='';
  l.presets.forEach(t=>{const x=document.createElement('button');x.textContent=t;x.addEventListener('click',()=>{sendMsg(t);$('mdlg').close();});b.appendChild(x);});
  if($('mdlg').showModal)$('mdlg').showModal();});
$('msnd').addEventListener('click',()=>{sendMsg($('mtx').value);$('mdlg').close();});
$('mcl').addEventListener('click',()=>$('mdlg').close());
function sendMsg(t){t=(t||'').trim();if(!t||!onl)return;onl.ref.child('msg').set({n:Date.now(),from:fbU.uid,name:PROF.name,text:t.slice(0,80)});}
$('tbat').addEventListener('click',()=>{if(onl&&onl.pend&&onl.win)onl.ref.child('ch').set('bat');});
$('tbow').addEventListener('click',()=>{if(onl&&onl.pend&&onl.win)onl.ref.child('ch').set('bowl');});
$('dcr').addEventListener('click',()=>{const ov=Math.min(20,Math.max(1,parseInt($('ovn').value)||2)),wk=Math.min(10,Math.max(1,parseInt($('wkn').value)||3));$('dlg').close();makeRoom(ov,wk);});
$('dcn').addEventListener('click',()=>$('dlg').close());
$('lcn').addEventListener('click',leaveLobby);
$('pdSel').addEventListener('click',()=>pdDo((r,u)=>r.child('sel').set(u)));
$('pdWait').addEventListener('click',()=>pdDo((r,u)=>r.child('sel').remove()));
$('pdRem').addEventListener('click',()=>pdDo((r,u)=>{const a=[r.child('pl/'+u).remove()];if(lob.d.sel===u)a.push(r.child('sel').remove());return Promise.all(a);}));
$('pdCl').addEventListener('click',()=>{const d=$('pdlg');if(d.close)d.close();});
$('stg').addEventListener('click',()=>{if(lob&&lob.host&&lob.d&&lob.d.sel)lob.ref.update({st:'play',toss:Math.random()<.5?'host':'guest',t0:Date.now()});});
$('wgs').addEventListener('click',()=>signIn());
$('skp').addEventListener('click',()=>{skipW=true;ui();show(L().hint);});
$('gsb').addEventListener('click',()=>{if(fbU)signOut();else signIn();});
$('rep').addEventListener('click',()=>say(G.started?scoreText()+'. '+need():L().none));
$('test').addEventListener('click',()=>{
  initAudio();vib([200]);const t=ac.currentTime+.1;
  tone(440,t,.35,{p:-1,g:.5});tone(440,t+.6,.35,{p:1,g:.5});tone(120,t+1.2,.25,{g:.8,f2:55});
  setTimeout(()=>say(L().testDone),1700);
});
$('langb').addEventListener('click',()=>{lg=lg==='en'?'hi':'en';ui();if(!G.started)show(L().hint);else show(scoreText());});
$('tts').addEventListener('change',e=>{tts=e.target.checked;$('status').setAttribute('aria-live',tts?'off':'polite');try{speechSynthesis.cancel();}catch(x){}});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if((e.code==='Space'||e.code==='Enter')&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='SUMMARY'){e.preventDefault();tap(0);}
  if(e.key==='ArrowLeft'){e.preventDefault();tap(-1);}
  if(e.key==='ArrowRight'){e.preventDefault();tap(1);}
  if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();tap(0);}
  if(e.key==='s'||e.key==='S')$('rep').click();
});
window.addEventListener('error',e=>show('Error: '+e.message));
ui();show($('pg-welc').hidden?L().hint:L().welcP);
try{if(localStorage.getItem('acs'))loadFB(()=>firebase.auth().onAuthStateChanged(u=>{if(u){fbU=u;PROF.name=u.displayName||(u.email||'Player').split('@')[0];ui();cloudMerge();}}));}catch(e){}
(function(){const c=$('cv'),x=c.getContext&&c.getContext('2d');
  function fr(){requestAnimationFrame(fr);if(!x||$('pg-match').hidden)return;
    x.clearRect(0,0,360,200);x.fillStyle='#c9a66b';x.beginPath();x.moveTo(150,10);x.lineTo(210,10);x.lineTo(280,190);x.lineTo(80,190);x.fill();
    x.fillStyle='#fff';[172,180,188].forEach(a=>x.fillRect(a-1,6,2,10));[160,180,200].forEach(a=>x.fillRect(a-2,168,4,22));
    if(ball&&ball.rel&&ac){const T=ball.hitAt-OFF()-ball.rel,p=(ac.currentTime-ball.rel)/T;
      if(p>0&&p<1.05){const h=p<.62?34*(1-p/.62):20*Math.sin((p-.62)/.38*Math.PI),bx=180+ball.line*(10+55*p)*p,by=16+150*p-h;
        x.fillStyle='#c1121f';x.beginPath();x.arc(bx,by,3+6*p,0,7);x.fill();x.strokeStyle='#fff';x.stroke();}}}
  fr();})();
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
})();
</script>
